# Copies the pinned uv and ffmpeg downloads into a release of this repository, so the app's
# one-time environment install never breaks when an upstream build is deleted.
# Run it by pushing a tag named runtime-<date>. The release is marked pre-release so the
# app's updater never mistakes it for an app version.
name: Mirror runtime downloads

on:
  push:
    tags: ['runtime-*']

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify
        run: |
          set -euo pipefail
          mkdir files && cd files
          fetch() { curl -fsSL -o "$1" "$2"; echo "$3  $1" | sha256sum -c -; }
          fetch uv-x86_64-pc-windows-msvc.zip \
            https://github.com/astral-sh/uv/releases/download/0.12.23/uv-x86_64-pc-windows-msvc.zip \
            75d05de6762778c31ee183398de7dd15093fad0ed90b1f236d8205ea5ec00c90
          fetch ffmpeg-n8.1.3-14-g330caae0c1-win64-gpl-8.1.zip \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-05-13-07/ffmpeg-n8.1.3-14-g330caae0c1-win64-gpl-8.1.zip \
            ce8f117aa804906c4a190367babfeeb0b9c8b2ea85ac128fa381b407f964af85
          ls -l
      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Runtime downloads ($GITHUB_REF_NAME)" \
            --notes "Pinned uv and ffmpeg (NVENC) builds used by the app's one-time environment install. Not an app release."
